<!doctype html>
<html lang="et">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ussimäng</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;background:#101b19;color:#edf7ef;font-family:system-ui,sans-serif;padding:24px}main{width:min(100%,500px)}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}h1{font-size:30px;margin:0;letter-spacing:-1px}.label{color:#92aaa0;font-size:12px;text-transform:uppercase;letter-spacing:2px}.scores{display:flex;gap:22px;text-align:right}.scores strong{display:block;font-size:24px}.board{position:relative;border:1px solid #354c41;border-radius:18px;overflow:hidden;background:#15251e;box-shadow:0 20px 60px #0004}canvas{display:block;width:100%;aspect-ratio:1;touch-action:none}.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:#101b19d9;backdrop-filter:blur(4px)}.overlay[hidden]{display:none}h2{font-size:28px;margin:0 0 8px}.overlay p{color:#b4c8bc;line-height:1.6;margin:0 0 24px}button{border:0;border-radius:12px;background:#bef264;color:#172514;padding:13px 24px;font:700 16px system-ui;cursor:pointer}button:hover{filter:brightness(1.08)}button:focus-visible{outline:3px solid white;outline-offset:3px}.toolbar{display:flex;align-items:center;justify-content:space-between;margin:16px 0;color:#a7bdb0;font-size:13px}.toolbar button{background:#293f33;color:#edf7ef;font-size:14px;padding:10px 16px}.controls{display:grid;grid-template-columns:repeat(3,54px);gap:7px;justify-content:center;margin:20px auto}.controls button{background:#293f33;color:#edf7ef;padding:12px}.up{grid-column:2}.left{grid-column:1}.hint{text-align:center;color:#92aaa0;font-size:12px;margin-bottom:0}
</style>
</head>
<body>
<main>
<header><div><div class="label">Väike mängupaus</div><h1>Ussimäng<span style="color:#bef264">.</span></h1></div><div class="scores"><div><span class="label">Punkte</span><strong id="score">0</strong></div><div><span class="label">Rekord</span><strong id="best">0</strong></div></div></header>
<div class="board"><canvas id="game" width="480" height="480" aria-label="Ussimängu mänguväli"></canvas><div class="overlay" id="overlay"><h2 id="title">Kas oled valmis?</h2><p id="message">Söö õunu ja kasvata ussi.<br>Hoia eemale seintest ja oma sabast.</p><button id="start">Alusta mängu</button></div></div>
<div class="toolbar"><span>← ↑ ↓ → või W A S D</span><button id="pause" disabled>Paus</button></div>
<div class="controls" aria-label="Juhtnupud"><button class="up" data-dir="up" aria-label="Üles">↑</button><button class="left" data-dir="left" aria-label="Vasakule">←</button><button data-dir="down" aria-label="Alla">↓</button><button data-dir="right" aria-label="Paremale">→</button></div>
<p class="hint">Tühik = paus · Telefonis võid ka mänguväljal pühkida.</p>
</main>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),overlay=document.getElementById('overlay'),title=document.getElementById('title'),message=document.getElementById('message'),start=document.getElementById('start'),pause=document.getElementById('pause');
const size=20,cell=24,dirs={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}};
let snake,food,dir,next,score=0,best=0,state='ready',timer,turned=false;
try{best=Number(localStorage.getItem('ussimang-rekord'))||0}catch{}bestEl.textContent=best;
function reset(){snake=[{x:9,y:10},{x:8,y:10},{x:7,y:10}];dir=dirs.right;next=dir;score=0;scoreEl.textContent=score;turned=false;placeFood();draw()}
function placeFood(){const free=[];for(let y=0;y<size;y++)for(let x=0;x<size;x++)if(!snake.some(p=>p.x===x&&p.y===y))free.push({x,y});food=free[Math.floor(Math.random()*free.length)]}
function draw(){ctx.fillStyle='#15251e';ctx.fillRect(0,0,480,480);ctx.strokeStyle='#203329';ctx.lineWidth=1;for(let i=1;i<size;i++){ctx.beginPath();ctx.moveTo(i*cell,0);ctx.lineTo(i*cell,480);ctx.moveTo(0,i*cell);ctx.lineTo(480,i*cell);ctx.stroke()}if(food){ctx.fillStyle='#fb866f';ctx.beginPath();ctx.arc(food.x*cell+12,food.y*cell+13,8,0,Math.PI*2);ctx.fill();ctx.fillStyle='#bef264';ctx.fillRect(food.x*cell+12,food.y*cell+2,3,5)}snake.forEach((p,i)=>{ctx.fillStyle=i===0?'#d7ff8a':'#91c651';ctx.beginPath();ctx.roundRect(p.x*cell+2,p.y*cell+2,20,20,6);ctx.fill();if(i===0){ctx.fillStyle='#172514';const eyes=dir.x?[[12+dir.x*4,7],[12+dir.x*4,16]]:[[7,12+dir.y*4],[16,12+dir.y*4]];eyes.forEach(([x,y])=>ctx.fillRect(p.x*cell+x-1,p.y*cell+y-1,3,3))}})}
function schedule(){clearTimeout(timer);if(state==='playing')timer=setTimeout(tick,Math.max(65,150-score*3))}
function tick(){dir=next;turned=false;const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};const eat=food&&head.x===food.x&&head.y===food.y;const body=eat?snake:snake.slice(0,-1);if(head.x<0||head.y<0||head.x>=size||head.y>=size||body.some(p=>p.x===head.x&&p.y===head.y)){finish(false);return}snake.unshift(head);if(eat){score++;scoreEl.textContent=score;if(score>best){best=score;bestEl.textContent=best;try{localStorage.setItem('ussimang-rekord',best)}catch{}}placeFood();if(!food){draw();finish(true);return}}else snake.pop();draw();schedule()}
function finish(won){state='over';clearTimeout(timer);pause.disabled=true;title.textContent=won?'Võit!':'Mäng läbi!';message.textContent=`Sinu tulemus: ${score} punkti. Rekord: ${best}.`;start.textContent='Mängi uuesti';overlay.hidden=false}
function begin(){clearTimeout(timer);reset();state='playing';overlay.hidden=true;pause.disabled=false;pause.textContent='Paus';schedule()}
function togglePause(){if(state==='playing'){state='paused';clearTimeout(timer);title.textContent='Paus';message.textContent='Hinga korraks. Uss ootab sind.';start.textContent='Jätka mängu';overlay.hidden=false;pause.textContent='Jätka'}else if(state==='paused'){state='playing';overlay.hidden=true;pause.textContent='Paus';schedule()}}
function turn(name){if(state!=='playing'||turned)return;const d=dirs[name];if(d.x===-dir.x&&d.y===-dir.y)return;next=d;turned=true}
start.addEventListener('click',()=>state==='paused'?togglePause():begin());pause.addEventListener('click',togglePause);
const keys={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right'};
document.addEventListener('keydown',e=>{const name=keys[e.key]||keys[e.key.toLowerCase()];if(name){e.preventDefault();turn(name)}if(e.code==='Space'&&e.target.tagName!=='BUTTON'){e.preventDefault();togglePause()}});
document.querySelectorAll('[data-dir]').forEach(b=>b.addEventListener('click',()=>turn(b.dataset.dir)));
let touch;canvas.addEventListener('pointerdown',e=>{touch={x:e.clientX,y:e.clientY};canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointerup',e=>{if(!touch)return;const dx=e.clientX-touch.x,dy=e.clientY-touch.y;touch=null;if(Math.max(Math.abs(dx),Math.abs(dy))<12)return;turn(Math.abs(dx)>Math.abs(dy)?dx>0?'right':'left':dy>0?'down':'up')});canvas.addEventListener('pointercancel',()=>touch=null);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='playing')togglePause()});reset();
</script>
</body>
</html>
